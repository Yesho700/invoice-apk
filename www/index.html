<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mohan E Ride - Invoice Manager</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/invoice-template.css">

  <!-- Core Libraries -->
  <script src="capacitor.js"></script>
</head>
<body>

  <!-- Root element for SPA -->
  <div id="app-root">
    <div class="page-loading">Initializing App...</div>
  </div>

  <!-- App Modules -->
  <script src="js/storage.js"></script>
  <script src="js/invoice-template.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script src="js/router.js"></script>

  <!-- Pages -->
  <script src="pages/dashboard.js"></script>
  <script src="pages/invoice-list.js"></script>
  <script src="pages/invoice-new.js"></script>
  <script src="pages/invoice-detail.js"></script>
  <script src="pages/history.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/storage-info.js"></script>

  <!-- Router Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Register routes
      Router.register({
        '/dashboard': renderDashboard,
        '/invoices': renderInvoiceList,
        '/invoices/new': renderInvoiceNew,
        '/invoices/:id/edit': renderInvoiceNew,
        '/invoices/:id': renderInvoiceDetail,
        '/history': renderHistory,
        '/settings': renderSettings,
        '/storage': renderStorageInfo,
      });

      // Start Router
      Router.start();
    });
  </script>

</body>
</html>
